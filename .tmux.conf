set -g mouse on
set -g base-index 1

# Vim integration
set -g status-keys vi
#set -g mode-keys vi
# Improve responsiveness in vim
set -g focus-events on
set-option -sg escape-time 11

# Use the default Shell
set-option -g default-shell ${SHELL}

# Set clipboard mode so apps inside tmux can intercept it
set -s set-clipboard on

# Increase scrollback buffer
set -g history-limit 10000

# Allows pictures
set -gq allow-passthrough on
set -g visual-activity off

# Allow for tmux window name to be automatically renamed
set-option -gw automatic-rename on

# ************************************************************************** //
# ************************************************************************** //
# UI
set -g status-position top
set -g status-justify absolute-centre

# Status left look and feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#[bg=green,fg=black,bold]  #S "
# Active window title (current pane)
set -g window-status-current-style bg=yellow,fg=black

# Status center look and feel
set -g window-status-separator "#[fg=green] | "
set -g window-status-format "#[bg=purple, fg=yellow] #I: #W"
set -g window-status-current-format " #[fg=black] #I:#[fg=purple, bg=yellow, bold] #W "

# Status right look and feel
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#[bg=green,fg=black] $USER @ $HOSTNAME "
set -ga status-right "#[bg=green,fg=black, none]│"
set -ga status-right "#[bg=green,fg=black] 󰭦 %Y-%m-%d 󰅐 %H:%M "
set -ga status-right "#[bg=green,g=black, none]│"
set -ga status-right '#[bg=green,fg=black] 󰁹 #(~/.config/tmux/scripts/battery.sh)% '

# Pane border look and feel
setw -g pane-border-status top
setw -g pane-border-format "#[bg=black,fg=green,bold] #P:#[bg=black,fg=yellow,bold] #{pane_current_command} "
setw -g pane-active-border-style "fg=yellow,bg=purple"
setw -g pane-border-style "fg=red,bg=blue"
setw -g pane-border-lines double

# General Colors
set -g status-bg purple
set -g status-fg white
# Status bar background and text
set -g status-style bg=blue,fg=white

# Inactive window titles
set -g window-status-style bg=grey,fg=black

# Left and right status bar sections
set -g status-left-style bg=green,fg=black
set -g status-right-style bg=green,fg=black

set -g pane-border-style fg=grey
set -g pane-active-border-style fg=purple


# Start windows and panes at 1, not 0 (easier to reach on keyboard)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on  # renumber when a window is closed

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# ************************************************************************** //
# ************************************************************************** //
# TPM (Tmux Plugin Manager)

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
